[project]
name = "design-reference-plugin"
version = "0.1.0"
description = "Claude Code plugin: per-block design reference control — MCP server + slash command"
requires-python = ">=3.12"
dependencies = [
    # pinned exactly: mcp 2.0.0 renamed mcp.server.fastmcp.FastMCP to
    # mcp.server.mcpserver.MCPServer, breaking this import — 1.12.4 is the
    # version this plugin was actually built and verified end-to-end against.
    "mcp[cli]==1.12.4",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
